          type: object
          item: Unreadconversation
        pagination: null
      activity:
        method: GET
        path: /v1/room/activity
        description: Notifications / activity log
        params:
        - name: limit
          type: integer
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        body: []
        response:
          type: object
          item: Activity
        pagination: null
      discussions:
        method: POST
        path: /v1/room/conversation/inboxnew
        description: Discussions inbox (POST, read-only)
        params: []
        body:
        - name: limit
          type: integer
          required: false
          positional: false
          default: 20
          description: ''
          fields: []
        - name: muted
          type: string
          required: false
          positional: false
          default: all
          description: ''
          fields: []
        - name: offset
          type: integer
          required: false
          positional: false
          default: 0
          description: ''
          fields: []
        - name: sort
          type: string
          required: false
          positional: false
          default: recent
          description: ''
          fields: []
        - name: unread
          type: boolean
          required: false
          positional: false
          default: false
          description: ''
          fields: []
        request_content_type: application/json
        response:
          type: object
          item: Inboxnew
        pagination: null
