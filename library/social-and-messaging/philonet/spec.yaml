  invite:
    description: Invite people to think about an article
    endpoints:
      send:
        method: POST
        path: /v1/room/thinking-invite
        description: Invite a user to share thoughts on an article
        params: []
        response:
          type: object
          item: Object
        pagination: null
        body:
        - name: url
          type: string
          required: true
