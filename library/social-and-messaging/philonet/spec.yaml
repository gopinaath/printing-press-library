name: philonet
description: Philonet (philonet.ai) social reading network - unofficial CLI over the web app backend api.typepilot.app
version: 0.1.0
base_url: https://api.typepilot.app
spec_source: sniffed
http_transport: standard
auth:
  type: bearer_token
  header: Authorization
  format: Bearer {token}
  env_vars:
  - PHILONET_TOKEN
  in: header
config:
  format: toml
  path: ~/.config/philonet-pp-cli/config.toml
resources:
  feed:
    description: Article and thought feeds
    endpoints:
      for_me:
        method: GET
        path: /v1/feed2/forme
        description: Personalized "For You" / friends feed (feed2 engine). filter=forme|friends
        params:
        - name: filter
          type: string
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        - name: page
          type: integer
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        - name: pageSize
          type: integer
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        body: []
        response:
          type: array
          item: FormeItem
        pagination: null
        response_path: items
      unified:
        method: GET
        path: /v1/room/feed/unified
        description: Unified feed. filter=discover|friends
        params:
        - name: filter
          type: string
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        - name: page
          type: integer
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        - name: pageSize
          type: integer
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        body: []
        response:
          type: array
          item: UnifiedItem
        pagination: null
        response_path: items
      moment:
        method: GET
        path: /v1/room/feed/moment
        description: Featured "moment" card
        params: []
        body: []
        response:
          type: object
          item: Moment
        pagination: null
      suggested:
        method: GET
        path: /v1/room/curiosity-sessions/suggested-feed
        description: Suggested curiosity-session feed
        params: []
        body: []
        response:
          type: object
          item: SuggestedFeed
        pagination: null
  thread:
    description: Articles and thought threads
    endpoints:
      get:
        method: GET
        path: /v1/room/articles/{article_id}/comments/{comment_id}
        description: Get one thought (comment) with article context and star quota
        params:
        - name: article_id
          type: string
          required: true
          positional: true
          default: null
          description: The article_id path segment
          fields: []
        - name: comment_id
          type: string
          required: true
          positional: true
          default: null
          description: The comment_id path segment
          fields: []
        body: []
        response:
          type: object
          item: Comment
        pagination: null
        example: '  philonet-pp-cli thread get 29018 26505 --agent'
        happy_args: article_id=29018;comment_id=26505
      replies:
        method: POST
        path: /v1/room/subcommentsnewthreadedv2
        description: List replies in a thought thread (POST, read-only)
        params: []
        body:
        - name: articleId
          type: integer
          required: true
          positional: false
          default: null
          description: ''
          fields: []
        - name: includeParentDetails
          type: boolean
          required: false
          positional: false
          default: true
          description: ''
          fields: []
        - name: jump_to_latest
          type: boolean
          required: false
          positional: false
          default: true
          description: ''
          fields: []
        - name: limit
          type: integer
          required: false
          positional: false
          default: 20
          description: ''
          fields: []
        - name: parentCommentId
          type: integer
          required: true
          positional: false
          default: null
          description: ''
          fields: []
        request_content_type: application/json
        response:
          type: object
          item: Room
        pagination: null
        mutation: false
        example: '  philonet-pp-cli thread replies --article-id 29018 --parent-comment-id 26505 --agent'
        happy_args: --article-id=29018;--parent-comment-id=26505
      article:
        method: POST
        path: /v1/room/article
        description: Get article detail, members and people (POST, read-only)
        params: []
        body:
        - name: articleId
          type: integer
          required: true
          positional: false
          default: null
          description: ''
          fields: []
        request_content_type: application/json
        response:
          type: array
          item: ArticlePeople
        pagination: null
        response_path: people
        mutation: false
        example: '  philonet-pp-cli thread article --article-id 29018 --agent'
        happy_args: --article-id=29018
      impact:
        method: GET
        path: /v1/room/articles/{article_id}/impact
        description: Reader impact stats for an article
        params:
        - name: article_id
          type: string
          required: true
          positional: true
          default: null
          description: The article_id path segment
          fields: []
        body: []
        response:
          type: object
          item: Impact
        pagination: null
        example: '  philonet-pp-cli thread impact 29018 --agent'
        happy_args: article_id=29018
  me:
    description: Your profile, reading stats and saved items
    endpoints:
      reading_stats:
        method: GET
        path: /v1/room/myreading/stats
        description: 'My reading stats: last 7 days, goals, personal bests'
        params: []
        body: []
        response:
          type: object
          item: Stat
        pagination: null
      standings:
        method: GET
        path: /v1/room/friendsstandings
        description: Friends thinking-time leaderboard
        params: []
        body: []
        response:
          type: object
          item: Friendsstanding
        pagination: null
      profile_stats:
        method: GET
        path: /v1/room/myprofilestats
        description: Streak and reading totals for a user
        params:
        - name: userId
          type: string
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        body: []
        response:
          type: object
          item: Myprofilestat
        pagination: null
      badge:
        method: GET
        path: /v1/room/verificationbadge
        description: Verification / top-learner badge for a user
        params:
        - name: userId
          type: string
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        body: []
        response:
          type: object
          item: Verificationbadge
        pagination: null
      metrics:
        method: GET
        path: /v1/room/metrics
        description: My verified categories, stars, streak
        params: []
        body: []
        response:
          type: object
          item: Metric
        pagination: null
      profile:
        method: POST
        path: /v1/room/mainprofilenew
        description: Full profile for a user (POST, read-only)
        params: []
        body:
        - name: userId
          type: string
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        request_content_type: application/json
        response:
          type: object
          item: Mainprofilenew
        pagination: null
        mutation: false
        example: '  philonet-pp-cli me profile --agent'
      thoughts:
        method: GET
        path: /v1/room/conversationsnew
        description: A user's thoughts (paged)
        params:
        - name: limit
          type: integer
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        - name: page
          type: integer
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        body: []
        response:
          type: object
          item: Conversationsnew
        pagination: null
      bookmarks:
        method: GET
        path: /v1/room/mybookmarks
        description: Bookmarked thoughts
        params: []
        body: []
        response:
          type: object
          item: Mybookmark
        pagination: null
      engagements:
        method: GET
        path: /v1/room/myengagements
        description: My engagements
        params: []
        body: []
        response:
          type: object
          item: Myengagement
        pagination: null
      awards:
        method: GET
        path: /v1/room/myawards
        description: Awards/stars received
        params: []
        body: []
        response:
          type: object
          item: Myaward
        pagination: null
      spotlights:
        method: GET
        path: /v1/room/spotlightsnew
        description: Spotlights
        params: []
        body: []
        response:
          type: object
          item: Spotlightsnew
        pagination: null
      read_later:
        method: GET
        path: /v1/room/readlater
        description: Read-later saved articles
        params: []
        body: []
        response:
          type: object
          item: Readlater
        pagination: null
      onboarding:
        method: GET
        path: /v1/users/onboarding
        description: Onboarding state and interests
        params: []
        body: []
        response:
          type: object
          item: Onboarding
        pagination: null
  friends:
    description: Friends, requests and activity
    endpoints:
      top:
        method: GET
        path: /v1/room/topfriends
        description: Top friends
        params: []
        body: []
        response:
          type: object
          item: Topfriend
        pagination: null
      thinking:
        method: GET
        path: /v1/room/friendsthinkinglist
        description: Friends/contacts thinking list with presence
        params: []
        body: []
        response:
          type: array
          item: FriendsthinkinglistUser
        pagination: null
        response_path: users
      requests:
        method: GET
        path: /v1/friend/requests
        description: Friend requests (type=received|sent|all)
        params:
        - name: limit
          type: integer
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        - name: offset
          type: integer
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        - name: type
          type: string
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        body: []
        response:
          type: object
          item: Request
        pagination: null
      requests_preview:
        method: GET
        path: /v1/friend/feed/friend-requests-preview
        description: Friend requests preview
        params: []
        body: []
        response:
          type: object
          item: FriendRequestsPreview
        pagination: null
      stories:
        method: GET
        path: /v1/friend/friendsasstories
        description: Friends activity as stories
        params:
        - name: forme
          type: boolean
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        - name: unread_only
          type: boolean
          required: false
          positional: false
          default: null
          description: ''
          fields: []
        body: []
        response:
          type: object
          item: Friendsasstory
        pagination: null
      send_request:
        method: POST
        path: /v1/friend/request
        description: Send a friend request
        params: []
        response:
          type: object
          item: Object
        pagination: null
        body:
        - name: target_user_id
          type: string
          required: true
          positional: false
          default: null
          description: ''
          fields: []
        request_content_type: application/json
        example: '  philonet-pp-cli friends send-request --target-user-id u_sample --dry-run'
      respond:
        method: PUT
        path: /v1/friend/request/{request_id}
        description: Accept or decline a friend request (action=accept|decline)
        params:
        - name: request_id
          type: string
          required: true
          positional: true
          default: null
          description: Request id (or sender user id)
          fields: []
        response:
          type: object
          item: Object
        pagination: null
        body:
        - name: action
          type: string
          required: true
          positional: false
          default: null
          description: accept or decline
          fields: []
        request_content_type: application/json
        example: '  philonet-pp-cli friends respond 123 --action accept --dry-run'
      withdraw:
        method: DELETE
        path: /v1/friend/request/withdraw/{user_id}
        description: Withdraw a sent friend request
        params:
        - name: user_id
          type: string
          required: true
          positional: true
          default: null
          description: Target user id
          fields: []
        response:
          type: object
          item: Object
        pagination: null
        example: '  philonet-pp-cli friends withdraw u_sample --dry-run'
  inbox:
    description: Notifications, unread counts, discussions and DMs
    endpoints:
      unread:
        method: GET
        path: /v1/room/unread
        description: Unread counters (notifications, invitations, total)
        params: []
        body: []
