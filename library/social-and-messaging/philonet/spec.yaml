types:
  Activity:
    fields:
    - name: activity
      type: array
    - name: has_unread
      type: bool
    - name: pagination
      type: ref:Pagination11
    - name: success
      type: bool
    - name: unread_count
      type: integer
  Article:
    fields:
    - name: academia
      type: bool
    - name: category
      type: string
    - name: comment_count
      type: string
    - name: created_at
      type: string
      format: date-time
    - name: description
      type: string
    - name: headline
      type: string
    - name: id
      type: integer
    - name: is_member
      type: bool
    - name: is_seen
      type: bool
    - name: reading_label
      type: string
    - name: reading_time
      type: object
    - name: summary
      type: string
    - name: tags
      type: array
    - name: thumbnail_url
      type: string
      format: url
    - name: title
      type: string
    - name: total_thoughts
      type: integer
    - name: url
      type: string
      format: url
  Article2:
    fields:
    - name: academia
      type: bool
    - name: category
      type: string
    - name: comment_count
      type: string
    - name: core_angle
      type: string
    - name: created_at
      type: string
      format: date-time
    - name: description
      type: string
    - name: headline
      type: string
    - name: id
      type: integer
    - name: is_member
      type: bool
    - name: is_seen
      type: bool
    - name: reading_label
      type: string
    - name: reading_time
      type: object
    - name: summary
      type: string
