          type: array
          item: Blog
        pagination: null
        response_path: blogs
        no_auth: true
  find:
    description: Live search across articles, thoughts and people
    endpoints:
      articles:
        method: POST
        path: /v1/room/search/articles
        description: 'Search articles (POST body: query, sort_by, limit, offset)'
        params: []
        body:
        - name: limit
          type: integer
          required: false
          positional: false
          default: 20
          description: ''
          fields: []
        - name: offset
          type: integer
          required: false
          positional: false
          default: 0
          description: ''
          fields: []
        - name: query
          type: string
          required: true
          positional: false
          default: null
          description: ''
          fields: []
        - name: sort_by
          type: string
          required: false
          positional: false
          default: relevance
          description: ''
          fields: []
        request_content_type: application/json
        response:
          type: object
          item: Article3
        pagination: null
        mutation: false
      thoughts:
        method: POST
        path: /v1/room/search/thoughts
        description: Search thoughts/comments
        params: []
        body:
        - name: limit
          type: integer
          required: false
          positional: false
          default: 20
          description: ''
          fields: []
        - name: offset
          type: integer
          required: false
          positional: false
          default: 0
          description: ''
          fields: []
        - name: query
          type: string
